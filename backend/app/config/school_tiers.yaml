# 双一流高校的校区 / 研究生院类后缀词。
# 校名以某双一流校名为前缀、且后缀含这些词时，仍判为双一流（异地办学或校区）。
campus_suffixes:
  - 校区 # 覆盖「深圳校区」「国际校区」「苏州校区」
  - 研究生院
  - 研究院
  - 分校
  - 学部 # 覆盖「医学部」

# 挂靠双一流高校的独立学院后缀词。
# 校名以某双一流校名为前缀、且后缀含这些词时，判为非双一流。
college_suffixes:
  - 学院
